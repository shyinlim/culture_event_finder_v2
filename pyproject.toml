[project]
name = "culture-event-finder-v2"
version = "0.1.0"
description = "Culture event search: Django JSON API + React SPA"
authors = [{ name = "shyin" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "requests>=2.32",
    "urllib3>=2.0",
    "toolkitsy>=0.1.0",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "pytest-cov>=6.0",
    "responses>=0.25",
]
