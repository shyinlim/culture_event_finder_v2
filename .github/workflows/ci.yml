name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-backend:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Run backend pytest suite
        env:
          DEBUG: "True"
        run: uv run --frozen pytest backend

  test-frontend:
    name: Frontend Tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend vitest suite
        working-directory: frontend
        run: npm test -- --run

  build-smoke:
    name: Production Image Smoke Test
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build production multi-stage Docker image
        run: docker build -f deployment/prod/Dockerfile -t culture-event-finder-prod .

      - name: Start production container
        run: |
          docker run -d --rm --name smoke-test \
            -p 8791:8791 \
            -e SECRET_KEY=ci-smoke-test-secret-key \
            -e ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0 \
            culture-event-finder-prod

      - name: Wait for service and run smoke tests
        run: |
          echo "Waiting for container service to be healthy..."
          timeout=30
          while [ $timeout -gt 0 ]; do
            if curl -sf http://127.0.0.1:8791/health > /dev/null; then
              echo "Health check responded successfully."
              break
            fi
            sleep 1
            timeout=$((timeout - 1))
          done

          if [ $timeout -eq 0 ]; then
            echo "Timeout waiting for service container."
            docker logs smoke-test
            exit 1
          fi

          echo "1. Verify /health returns 200"
          curl -sf http://127.0.0.1:8791/health

          echo "2. Verify /health/ with trailing slash returns 200"
          curl -sf http://127.0.0.1:8791/health/

          echo "3. Verify / serves frontend SPA HTML"
          curl -sf http://127.0.0.1:8791/ | grep -q "root"

          echo "4. Verify /api/v1/countries returns valid JSON"
          curl -sf http://127.0.0.1:8791/api/v1/countries | grep -q "Taiwan"

          echo "All smoke tests passed."

      - name: Cleanup container
        if: always()
        run: docker stop smoke-test 2>/dev/null || true
