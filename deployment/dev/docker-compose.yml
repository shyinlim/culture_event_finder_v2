# Explicit project name avoids collision with other compose projects.
name: culture_event_finder_v2

services:
  backend:
    build:
      # Path is relative to deployment/dev, pointing to repo root.
      context: ../..
      dockerfile: deployment/dev/backend.Dockerfile
    # Run with host user ID so Linux host can write to bind mounts.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ../..:/app
    environment:
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    ports:
      - "8789:8789"
