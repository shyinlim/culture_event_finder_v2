# Explicit project name avoids collision with other compose projects.
name: culture_event_finder_v2

services:
  backend:
    build:
      # Path is relative to deployment/dev, pointing to repo root.
      context: ../..
      dockerfile: deployment/dev/backend.Dockerfile
    # Run with host user ID so Linux host can write to bind mounts.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ../..:/app
    environment:
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,backend
    ports:
      - "8789:8789"

  frontend:
    build:
      context: ../..
      dockerfile: deployment/dev/frontend.Dockerfile
    volumes:
      - ../../frontend:/app/frontend
      # Named volume prevents host node_modules from overwriting container node_modules.
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      # File change events can be unreliable in Docker on macOS/Windows, so polling is enabled.
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    ports:
      - "8790:8790"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
